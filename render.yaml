services:
  - type: web
    name: wishly
    runtime: node
    plan: free               # free: sleeps after ~15 min idle, and saved orders reset on restart/redeploy
    buildCommand: "true"     # no dependencies to install
    startCommand: node server.js
    healthCheckPath: /api/catalog
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true  # read it in the Render dashboard (Environment tab)
